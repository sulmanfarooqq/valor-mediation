[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  external_node_modules = ["ejs"]
  included_files = ["views/**", "public/**", "models/**", "config/**", "services/**", "middleware/**", "utils/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
